    <path d="M256 124C328 124 384 178 384 248V268C384 300 358 326 326 326H186C154 326 128 300 128 268V248C128 178 184 124 256 124Z" fill="url(#cakuBody)"/>
    <ellipse cx="198" cy="176" rx="52" ry="30" fill="#FFFFFF" opacity="0.18" transform="rotate(-28 198 176)"/>

