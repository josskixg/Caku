<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="cakuIconTitle">
  <title id="cakuIconTitle">Caku</title>

  <defs>
